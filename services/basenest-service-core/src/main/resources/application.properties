# service config
spring.application.name=basenest-service-core
server.port=8080
# App Configuration
app.auth.jwt-secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.auth.jwt-expire-days=${JWT_EXPIRE_DAYS:7}
app.auth.login-max-failed=${LOGIN_MAX_FAILED:5}
app.auth.login-lock-minutes=${LOGIN_LOCK_MINUTES:15}
# ============================================================
# Datasource: primary (basenest-service)
# ============================================================
spring.datasource.primary.url=jdbc:mysql://127.0.0.1:3306/basenest-service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.primary.username=root
spring.datasource.primary.password=root123456
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.primary.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.primary.druid.initial-size=5
spring.datasource.primary.druid.min-idle=5
spring.datasource.primary.druid.max-active=20
spring.datasource.primary.druid.max-wait=60000
# ============================================================
# Datasource: system (basenest-system)
# ============================================================
spring.datasource.system.url=jdbc:mysql://127.0.0.1:3306/basenest-system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.system.username=root
spring.datasource.system.password=root123456
spring.datasource.system.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.system.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.system.druid.initial-size=5
spring.datasource.system.druid.min-idle=5
spring.datasource.system.druid.max-active=20
spring.datasource.system.druid.max-wait=60000
# ============================================================
# MyBatis: primary (app module)
# ============================================================
mybatis.primary.mapper-locations=classpath:mapper/app/*.xml
mybatis.primary.type-aliases-package=com.basenest.core.dao.dos.app
mybatis.primary.configuration.map-underscore-to-camel-case=true
mybatis.primary.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# ============================================================
# MyBatis: system (system module)
# ============================================================
mybatis.system.mapper-locations=classpath:mapper/system/*.xml
mybatis.system.type-aliases-package=com.basenest.core.dao.dos.system
mybatis.system.configuration.map-underscore-to-camel-case=true
mybatis.system.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# ============================================================
# Logging
# ============================================================
logging.level.com.basenest.core.dao.mapper.app=debug
logging.level.com.basenest.core.dao.mapper.system=debug
